backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "store"
    label: "المتجر وقطع الغيار"
    files:
      - name: "products"
        label: "المنتجات"
        file: "products.json"
        fields:
          - label: "قائمة المنتجات وقطع الغيار"
            name: "items"
            widget: "list"
            fields:
              - {label: "اسم المنتج", name: "title", widget: "string"}
              - {label: "السعر أو الوصف المختصر", name: "price", widget: "string"}
              - {label: "صورة المنتج", name: "image", widget: "image"}
              - {label: "تفاصيل المنتج", name: "description", widget: "text"}
