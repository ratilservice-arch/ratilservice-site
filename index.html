<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RATIL serviceTech - صيانة أجهزة التجميل والعناية بالبشرة</title>
    <!-- أيقونة الموقع (Favicon) -->
    <link rel="icon" type="image/jpeg" href="logo-icon.jpg">
    <!-- خط عربي عصري -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #10b981; /* أخضر متناسق مع الشعار */
            --primary-dark: #047857;
            --dark-bg: #111827;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #1f2937;
            --text-light: #f9fafb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #f3f4f6;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* الشريط العلوي */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-container img {
            height: 45px;
            object-fit: contain;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav a {
            color: #e5e7eb;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        nav a:hover {
            color: var(--primary);
        }

        /* الواجهة الرئيسية كاملة الشاشة */
        .hero {
            min-height: 100vh;
            width: 100%;
            background: linear-gradient(rgba(17, 24, 39, 0.75), rgba(17, 24, 39, 0.85)),
                        url('https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 100px 5% 40px;
            color: var(--text-light);
        }

        .hero-badge {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid var(--primary);
            color: #6ee7b7;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.9rem;
