<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب صيانة - RATIL serviceTech</title>
    <link rel="icon" type="image/jpeg" href="logo-icon.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #10b981; --primary-dark: #047857; --dark-bg: #111827; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #f3f4f6; color: #1f2937; }
        header { background: rgba(17, 24, 39, 0.95); padding: 14px 6%; display: flex; justify-content: space-between; align-items: center; }
        header a { color: #fff; text-decoration: none; font-weight: 700; }
        header img { height: 42px; }
        main { max-width: 720px; margin: 0 auto; padding: 36px 6% 60px; }
        h1 { font-size: 2rem; margin-bottom: 8px; }
        .line { width: 70px; height: 4px; background: var(--primary); border-radius: 2px; margin: 12px 0 22px; }
        .lead { color: #4b5563; line-height: 1.7; margin-bottom: 22px; }
        form { background: #fff; border-radius: 20px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 700; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 12px 15px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 1rem; background: #fff; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
        button { width: 100%; padding: 14px; background: #25d366; color: #fff; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; }
        button:hover { background: #128c7e; }
        .note { margin-top: 12px; color: #4b5563; font-size: 0.9rem; line-height: 1.6; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" aria-label="العودة إلى الرئيسية"><img src="logo.jpg" alt="RATIL serviceTech"></a>
        <a href="index.html">العودة للرئيسية</a>
    </header>
    <main>
        <h1>استمارة طلب الصيانة</h1>
        <div class="line"></div>
        <p class="lead">املأ بياناتك، ثم نفتح واتساب برسالة جاهزة لتحديد موعد الفحص أو التدخل التقني.</p>
        <form id="maintenanceForm">
            <div class="form-group">
                <label for="clientName">اسم الصالون أو العميل</label>
                <input id="clientName" name="name" type="text" required maxlength="80" placeholder="مثال: صالون الجمال">
            </div>
            <div class="form-group">
                <label for="clientPhone">رقم الهاتف</label>
                <input id="clientPhone" name="phone" type="tel" required maxlength="20" placeholder="مثال: 0661314631">
            </div>
            <div class="form-group">
                <label for="clientAddress">العنوان / المدينة</label>
                <input id="clientAddress" name="address" type="text" required maxlength="80" placeholder="مثال: وهران، الجزائر">
            </div>
            <div class="form-group">
                <label for="deviceType">نوع الجهاز</label>
                <select id="deviceType" name="device">
                    <option value="جهاز ليزر إزالة الشعر">جهاز ليزر إزالة الشعر</option>
                    <option value="جهاز هيدرافيشل (Hydrafacial)">جهاز هيدرافيشل (Hydrafacial)</option>
                    <option value="جهاز تخسيس / كافيتيشن">جهاز تخسيس / كافيتيشن</option>
                    <option value="جهاز عناية بالبشرة آخر">جهاز عناية بالبشرة آخر</option>
                </select>
            </div>
            <div class="form-group">
                <label for="issueDesc">وصف العطل باختصار</label>
                <textarea id="issueDesc" name="issue" rows="3" required maxlength="400" placeholder="اشرح المشكلة التي تظهر في الجهاز..."></textarea>
            </div>
            <button type="submit"><i class="fa-brands fa-whatsapp" aria-hidden="true"></i> إرسال الطلب عبر واتساب</button>
            <p class="note">لن يحفظ الموقع هذه البيانات. ستفتح رسالة واتساب لتراجعها وترسلها بنفسك.</p>
        </form>
    </main>
    <script>
    document.getElementById('maintenanceForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const name = document.getElementById('clientName').value.trim();
        const phone = document.getElementById('clientPhone').value.trim();
        const address = document.getElementById('clientAddress').value.trim();
        const device = document.getElementById('deviceType').value.trim();
        const desc = document.getElementById('issueDesc').value.trim();
        if (!name || !phone || !address || !device || !desc) return;
        const message = [
            'مرحباً Ratil serviceTech، لدي طلب صيانة جديد:',
            `الاسم/الصالون: ${name}`,
            `الهاتف: ${phone}`,
            `العنوان: ${address}`,
            `الجهاز: ${device}`,
            `تفاصيل العطل: ${desc}`
        ].join('\n');
        const url = new URL('https://wa.me/213661314631');
        url.searchParams.set('text', message);
        window.location.assign(url.toString());
    });
    </script>
</body>
</html>
