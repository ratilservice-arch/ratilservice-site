    <style>
        :root { --primary: #10b981; --text-dark: #1f2937; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #f3f4f6; color: var(--text-dark); }
        header { background: rgba(17, 24, 39, 0.95); padding: 14px 6%; display: flex; justify-content: space-between; align-items: center; }
        header a { color: #fff; text-decoration: none; font-weight: 700; }
        header img { height: 42px; }
        main { max-width: 1100px; margin: 0 auto; padding: 36px 6% 60px; }
        h1 { font-size: 2rem; text-align: center; }
        .line { width: 70px; height: 4px; background: var(--primary); border-radius: 2px; margin: 12px auto 28px; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05); transition: 0.3s; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; }
        .card:hover { transform: translateY(-5px); }
        .card h3 { font-size: 1.25rem; margin-bottom: 10px; }
        .card p { color: #4b5563; font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; }
        .card-btn { display: inline-block; text-align: center; padding: 10px 18px; background: #f3f4f6; color: var(--text-dark); text-decoration: none; border-radius: 8px; font-weight: 700; transition: 0.3s; }
        .card-btn:hover { background: var(--primary); color: #fff; }
